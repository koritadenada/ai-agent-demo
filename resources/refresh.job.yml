resources:
  jobs:
    refresh:
      name: portcall-refresh
      description: Hourly data refresh, pipelines only. UC functions and metric views are applied by the setup job.
      # Batch freshness is enough here: standard mode trades a few minutes of start-up for fewer DBUs
      performance_target: STANDARD
      schedule:
        quartz_cron_expression: ${var.refresh_cron}
        timezone_id: UTC
        pause_status: ${var.refresh_schedule_status}
      max_concurrent_runs: 1
      tags:
        project: ${bundle.name}
        workload: refresh
      tasks:
        - task_key: platform_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.platform_pipeline.id}
        - task_key: documents
          depends_on:
            - task_key: platform_data   # needs the expense vocabulary from silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.documents_pipeline.id}
        - task_key: gold
          depends_on:
            - task_key: documents
          pipeline_task:
            pipeline_id: ${resources.pipelines.gold_pipeline.id}
