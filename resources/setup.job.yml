resources:
  jobs:
    setup:
      name: portcall-setup
      description: Run after each deploy. Applies the UC functions, seeds missing prompts, refreshes the data once, applies the metric views, then the Port Assistant's tools and the app tables.
      performance_target: STANDARD
      max_concurrent_runs: 1
      tags:
        project: ${bundle.name}
        workload: setup
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - pyyaml
              - mlflow>=3.1
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: gold_schema
          default: ${resources.schemas.gold.name}
        - name: silver_schema
          default: ${resources.schemas.silver.name}
        - name: app_schema
          default: ${resources.schemas.app.name}
        - name: agent_schemas   # code agent (folder in src/app/server/agents) = its schema
          default: port-assistant=${resources.schemas.port_assistant.name},quote-negotiator=${resources.schemas.quote_negotiator.name},timeline-summarizer=${resources.schemas.timeline_summarizer.name}
      tasks:
        - task_key: uc_functions
          environment_key: default
          spark_python_task:
            python_file: ../src/deploy/apply_sql_objects.py
            parameters: ["--kind", "functions", "--catalog", "{{job.parameters.catalog}}",
                         "--gold-schema", "{{job.parameters.gold_schema}}", "--silver-schema", "{{job.parameters.silver_schema}}"]
        - task_key: prompts
          environment_key: default
          spark_python_task:
            python_file: ../src/deploy/apply_sql_objects.py
            parameters: ["--kind", "prompts", "--catalog", "{{job.parameters.catalog}}",
                         "--gold-schema", "{{job.parameters.gold_schema}}", "--silver-schema", "{{job.parameters.silver_schema}}",
                         "--agent-schemas", "{{job.parameters.agent_schemas}}"]
        - task_key: refresh
          depends_on:
            - task_key: uc_functions   # gold calls the bank-check functions
            - task_key: prompts        # the document pipeline loads its prompts
          run_job_task:
            job_id: ${resources.jobs.refresh.id}
        - task_key: metric_views
          depends_on:
            - task_key: refresh        # metric views need the gold tables
          environment_key: default
          spark_python_task:
            python_file: ../src/deploy/apply_sql_objects.py
            parameters: ["--kind", "metric_views", "--catalog", "{{job.parameters.catalog}}",
                         "--gold-schema", "{{job.parameters.gold_schema}}", "--silver-schema", "{{job.parameters.silver_schema}}"]
        - task_key: agents
          depends_on:
            - task_key: metric_views   # the Genie agents read the metric views
          environment_key: default
          spark_python_task:
            python_file: ../src/deploy/apply_agents.py
            parameters: ["--catalog", "{{job.parameters.catalog}}", "--gold-schema", "{{job.parameters.gold_schema}}",
                         "--silver-schema", "{{job.parameters.silver_schema}}", "--app-schema", "{{job.parameters.app_schema}}",
                         "--agent-schemas", "{{job.parameters.agent_schemas}}",
                         "--app-service-principal", "${resources.apps.agents_app.service_principal_client_id}"]
