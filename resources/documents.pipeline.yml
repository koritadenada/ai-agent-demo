resources:
  pipelines:
    documents_pipeline:
      name: portcall-documents
      catalog: ${var.catalog}
      schema: ${resources.schemas.silver.name}
      serverless: true
      continuous: false
      channel: CURRENT
      tags:
        project: ${bundle.name}
        layer: documents
      root_path: ../src/pipelines/documents
      libraries:
        - glob:
            include: ../src/pipelines/documents/transformations/**
      configuration:
        allow_reset: ${var.allow_reset}
        catalog: ${var.catalog}
        silver_schema: ${resources.schemas.silver.name}
        documents_path: /Volumes/${var.catalog}/${resources.schemas.landing.name}/${resources.volumes.documents_volume.name}
        llm_endpoint: ${var.llm_endpoint}
