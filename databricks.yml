# Port-call data platform for AI agents: platform data (DMS -> S3) and documents (PDF -> S3),
# bronze -> silver -> gold, metric views for Genie.
bundle:
  name: ai-agent-demo

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog that holds every schema of this project
  schema_prefix:
    description: Optional prefix for the landing, bronze, silver and gold schemas
    default: ""
  warehouse_id:
    description: SQL warehouse used for metric views and Genie
    lookup:
      warehouse: Serverless Starter Warehouse
  dms_source_schema:
    description: Source schema name as DMS writes it in the bucket (<schema>/<table>/)
    default: da_schema
  bronze_mode:
    description: build (ingest the DMS files into this bundle's bronze) or existing (silver reads bronze_source)
    default: build
  bronze_source:
    description: catalog.schema of an existing bronze with the same envelope, used when bronze_mode is existing
    default: ""
  column_renames:
    description: 'JSON map of source columns to neutral silver names, {"table": {"source_column": "silver_column"}}'
    default: "{}"
  supervisor_name:
    description: Display name of the HAL-9000 supervisor agent (unique in the workspace)
    default: HAL-9000 port calls
  agent_llm_endpoint:
    description: Model behind the app agents (AI Negotiator, DA Event Summarizer), unless a prompt version sets its own
    default: databricks-claude-sonnet-5-5
  llm_endpoint:
    description: Default model for ai_query when a prompt version does not name one
    default: databricks-gpt-5-mini
  prompt_alias:
    description: >-
      Alias of the prompt versions the document pipeline uses (MLflow Prompt Registry). Move the alias to a new
      version to change a prompt or its model without a deploy; use another alias (for example challenger) to compare
    default: production
  refresh_schedule_status:
    description: PAUSED or UNPAUSED for the refresh job
    default: PAUSED
  refresh_cron:
    description: Quartz cron of the refresh job. Hourly matches today's freshness; most dashboards only need daily
    default: "0 0 * * * ?"
  allow_reset:
    description: >-
      Whether a full refresh may rebuild bronze and the AI tables. Keep false in production: a reset re-runs every
      LLM call and DMS files may no longer be there to replay
    default: "false"
  match_tolerance_pct:
    description: Final vs quote difference still considered a match (percent)
    default: "2"
  dispute_threshold_pct:
    description: Final vs quote difference above which a line is disputed (percent)
    default: "10"
  min_benchmark_sample:
    description: Past lines a benchmark level needs before it is used (the cascade falls back to the next level)
    default: "3"
  quote_flag_pct:
    description: Quote above the benchmark median by more than this (percent) is flagged for negotiation
    default: "10"
  # Only used by the prod target (external storage in your AWS account)
  storage_credential_name:
    description: UC storage credential created by infra/terraform
    default: ""
  dms_bucket_url:
    description: s3:// URL of the DMS target bucket, for example s3://my-dms-bucket/
    default: ""
  documents_bucket_url:
    description: s3:// URL of the documents bucket
    default: ""

targets:
  # Self-contained demo: managed volumes stand in for the two S3 buckets, mock data fills them.
  demo:
    default: true
    presets:
      pipelines_development: true
      trigger_pause_status: PAUSED
    variables:
      catalog: main
      schema_prefix: portcall_
      allow_reset: "true"

  # Your AWS account: the volumes point at the real DMS and documents buckets.
  prod:
    mode: production
    # Deploy from CI as a service principal; one copy per principal
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: portcall
      refresh_schedule_status: UNPAUSED
    resources:
      catalogs:
        portcall:
          name: ${var.catalog}
          comment: Port-call data platform for AI agents
      external_locations:
        dms_bucket:
          name: portcall_dms_bucket
          url: ${var.dms_bucket_url}
          credential_name: ${var.storage_credential_name}
          read_only: true
          comment: DMS full load and CDC files (Parquet)
        documents_bucket:
          name: portcall_documents_bucket
          url: ${var.documents_bucket_url}
          credential_name: ${var.storage_credential_name}
          read_only: true
          comment: PDF documents keyed by DA and attachment
      schemas:
        landing:
          catalog_name: ${resources.catalogs.portcall.name}
      volumes:
        dms_volume:
          volume_type: EXTERNAL
          storage_location: ${resources.external_locations.dms_bucket.url}
        documents_volume:
          volume_type: EXTERNAL
          storage_location: ${resources.external_locations.documents_bucket.url}
